<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Refrakt Custom Cuts - get in touch about our gemstones or custom cutting services">
    <meta name="theme-color" content="#2d2d2d">
    <title>Contact - Refrakt Custom Cuts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header role="banner">
        <div class="header-content">
            <h1>Refrakt Custom Cuts</h1>
            <p class="tagline">Exceptional gemstones shaped and polished in Austin, Texas.</p>
        </div>
        <nav class="main-nav" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Cut Gemstones</a></li>
                <li><a href="custom.html">Custom Cutting</a></li>
                <li><a href="about.html">Our Story</a></li>
                 <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main role="main">
        <section class="text-content-title">
            <h2>Contact</h2>
            <p class="text-content-block">We are located in Austin, Texas. For inquiries, please use the form below.</p>
          <form class="contact-form" action="https://formspree.io/f/xgozyprn" method="POST">
            <label>
              <span>Your email:</span>
              <input type="email" name="email" required aria-required="true">
            </label>
            <label>
              <span>Your message:</span>
              <textarea name="message" required aria-required="true"></textarea>
            </label>
            <button type="submit">Send Message</button>
          </form>
        </section>
    </main>

    <footer role="contentinfo">
        <p>&copy; 2025 Refrakt Custom Cuts. All rights reserved.</p>
    </footer>
</body>
</html>
